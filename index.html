<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議事録ヒーロー</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: #eff6ff;
            --dark-btn: #0f172a;
            --dark-btn-hover: #1e293b;
            
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-floating: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'BIZ UDPGothic', "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .step-badge, .btn-primary, .btn-sm, .bot-tooltip {
            font-family: 'Zen Maru Gothic', 'BIZ UDPGothic', sans-serif;
        }

        .topbar {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .topbar-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-left: 8px;
            padding-left: 12px;
            border-left: 2px solid var(--border-light);
            font-weight: 500;
        }

        @media (max-width: 640px) { .brand-sub { display: none; } }

        .api-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .api-toggle-btn:hover {
            border-color: var(--border-medium);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .status-dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .api-drawer {
            display: none;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 24px;
            box-shadow: var(--shadow-md);
            position: relative;
            z-index: 49;
        }

        .api-drawer.open { display: block; animation: slideDown 0.3s ease-out; }

        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .api-drawer-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .api-drawer-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex: 1 1 300px;
        }

        .api-drawer-form {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            max-width: 500px;
        }

        .api-drawer-form input {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            background-color: var(--bg-canvas);
            transition: all 0.2s;
            font-family: inherit;
        }

        .api-drawer-form input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: #fff;
        }

        .workspace {
            max-width: 1440px;
            margin: 32px auto;
            padding: 0 24px 60px 24px;
            display: flex;
            gap: 32px;
            align-items: stretch;
            flex-grow: 1;
            width: 100%;
        }

        @media (max-width: 960px) {
            .workspace { flex-direction: column; padding: 0 16px 40px 16px; gap: 24px; }
        }

        .column {
