<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議事録ヒーロー</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: #eff6ff;
            --dark-btn: #0f172a;
            --dark-btn-hover: #1e293b;

            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-floating: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'BIZ UDPGothic', "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .step-badge, .btn-primary, .btn-sm, .bot-tooltip {
            font-family: 'Zen Maru Gothic', 'BIZ UDPGothic', sans-serif;
        }

        .topbar {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .topbar-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-left: 8px;
            padding-left: 12px;
            border-left: 2px solid var(--border-light);
            font-weight: 500;
        }

        @media (max-width: 640px) { .brand-sub { display: none; } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            font-family: inherit;
        }

        .api-toggle-btn:hover {
            border-color: var(--border-medium);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .status-dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .api-drawer {
            display: none;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 24px;
            box-shadow: var(--shadow-md);
            position: relative;
            z-index: 49;
        }

        .api-drawer.open { display: block; animation: slideDown 0.3s ease-out; }

        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .api-drawer-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .api-drawer-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex: 1 1 300px;
        }

        .api-drawer-form {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            max-width: 500px;
        }

        .api-drawer-form input {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            background-color: var(--bg-canvas);
            transition: all 0.2s;
            font-family: inherit;
        }

        .api-drawer-form input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: #fff;
        }

        /* 履歴ドロワー */
        .history-drawer {
            display: none;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-light);
            padding: 18px 24px;
            box-shadow: var(--shadow-md);
            position: relative;
            z-index: 48;
        }

        .history-drawer.open { display: block; animation: slideDown 0.25s ease-out; }

        .history-drawer-inner {
            max-width: 1440px;
            margin: 0 auto;
        }

        .history-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 12px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            max-height: 240px;
            overflow-y: auto;
        }

        .history-card {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.15s;
        }

        .history-card:hover {
            border-color: var(--accent-primary);
            background-color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .history-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-preview {
            font-size: 0.85rem;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .history-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .workspace {
            max-width: 1440px;
            margin: 32px auto;
            padding: 0 24px 60px 24px;
            display: flex;
            gap: 32px;
            align-items: stretch;
            flex-grow: 1;
            width: 100%;
        }

        @media (max-width: 960px) {
            .workspace { flex-direction: column; padding: 0 16px 40px 16px; gap: 24px; }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex: 1;
        }

        .column-right {
            flex: 1.15;
        }

        #panel-step2, #panel-step4 {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #panel-step2 .panel-body, #panel-step4 .panel-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .generate-btn-wrapper {
            margin-top: auto;
        }

        .qa-content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .panel {
            background-color: var(--bg-surface);
            border: none;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .panel:hover {
            box-shadow: var(--shadow-floating);
            transform: translateY(-2px);
        }

        .panel-header {
            padding: 16px 24px;
            background-color: #ffffff;
            border-bottom: 2px solid var(--bg-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .panel-title-group { display: flex; align-items: center; gap: 10px; }

        .step-badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .panel-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .panel-body { padding: 24px; }

        .textarea-wrapper {
            position: relative;
            border-radius: var(--radius-lg);
        }

        .textarea-wrapper.drag-over #transcript-input {
            border-color: var(--accent-primary);
            background-color: var(--accent-soft);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        #transcript-input {
            width: 100%;
            min-height: 280px;
            padding: 16px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.75;
            color: var(--text-primary);
            background-color: var(--bg-subtle);
            resize: vertical;
            transition: all 0.2s;
        }

        #transcript-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-surface);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
        }

        .input-footer-hint {
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            flex-wrap: wrap;
        }

        .link-btn {
            background: none; border: none; padding: 4px 8px; border-radius: 4px;
            font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }

        .link-btn:hover { background-color: var(--bg-subtle); color: var(--accent-primary); }

        .setting-block { margin-bottom: 26px; }
        .setting-block:last-of-type { margin-bottom: 30px; }

        .setting-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

        .setting-label { font-size: 0.9rem; font-weight: 700; color: var
