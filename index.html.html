<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議事録ヒーロー</title>
    <style>
        :root {
            --primary-color: #f59e0b; 
            --primary-hover: #d97706;
            --secondary-color: #3b82f6; 
            --secondary-hover: #2563eb;
            /* 背景色を淡いライトブルーに変更 */
            --bg-color: #e0f2fe; 
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1::before {
            content: "🤖"; 
            font-size: 2rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* カラムレイアウトの整備 */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: stretch;
        }

        .left-column, .right-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* 伸縮させて高さを揃えるためのクラス */
        .flex-grow-card {
            flex-grow: 1;
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 16px;
            color: #334155;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 入力エリア */
        #transcript-input {
            width: 100%;
            flex-grow: 1;
            min-height: 350px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: var(--text-main);
            line-height: 1.8;
        }

        #transcript-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        /* 項目選択 */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            display: none;
        }

        .checkbox-wrapper label {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .checkbox-wrapper input[type="checkbox"]:checked + label {
            background-color: #fffbeb;
            border-color: var(--primary-color);
            color: var(--primary-hover);
            font-weight: bold;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: auto;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        .btn-main:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        /* 出力エリア */
        .btn-copy {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }

        .output-content {
            flex-grow: 1;
            min-height: 350px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            font-size: 0.95rem;
            overflow-y: auto;
            position: relative;
        }

        .processing-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(248, 250, 252, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
            z-index: 10;
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 4px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 検索・QAエリア */
        .qa-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
        }

        .qa-input-group {
            display: flex;
            gap: 10px;
        }

        .qa-input-group input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .qa-input-group input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-search {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-search:hover {
            background-color: var(--secondary-hover);
        }
        
        .btn-search:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .qa-answer {
            margin-top: 16px;
            padding: 16px;
            background-color: white;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
            display: none;
            position: relative;
        }
        
        .qa-answer::before {
            content: "💡 AIの回答：";
            display: block;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>議事録ヒーロー</h1>
        <p>テキストを入力し、必要な項目を選ぶだけ。会議の疑問はAIアシスタントに直接質問できます。</p>
    </div>

    <div class="container">
        <!-- 左カラム：入力・設定エリア -->
        <div class="left-column">
            
            <div class="card flex-grow-card">
                <div class="card-header">📝 1. 会議の内容（文字起こし）を入力</div>
                <textarea id="transcript-input" placeholder="ここに会議の文字起こしテキストやメモを貼り付けてください..."></textarea>
            </div>

            <div class="card">
                <div class="card-header">⚙️ 2. まとめる項目を選択</div>
                <div class="options-grid" id="options-container">
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-date" value="日付" checked><label for="opt-date">日付</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-name" value="参加者" checked><label for="opt-name">参加者</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-summary" value="要点" checked><label for="opt-summary">要点</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-decision" value="決定事項" checked><label for="opt-decision">決定事項</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-task" value="タスク" checked><label for="opt-task">タスク</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-important" value="重要事項" checked><label for="opt-important">重要事項</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-opinion" value="意見"><label for="opt-opinion">意見</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-issue" value="課題・懸念点" checked><label for="opt-issue">課題・懸念点</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-pending" value="保留事項" checked><label for="opt-pending">保留事項</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="opt-next" value="次回予定" checked><label for="opt-next">次回予定</label></div>
                </div>

                <button class="btn-main" id="generate-btn" onclick="generateMinutes()">
                    <span id="btn-text">🚀 議事録を作成する</span>
                </button>
            </div>

        </div>

        <!-- 右カラム：結果・QAエリア -->
        <div class="right-column">
            
            <div class="card flex-grow-card">
                <div class="card-header">
                    <span>📄 3. 生成結果</span>
                    <button class="btn-copy" onclick="copyToClipboard()" id="copy-btn">📋 コピーする</button>
                </div>
                
                <div class="output-content" id="output-area">
                    <div class="processing-overlay" id="processing-overlay">
                        <div class="loader"></div>
                        <div style="color: var(--primary-color); font-weight: bold;">AIが分析・作成中です...</div>
                    </div>
                    
                    <div id="output-text">
                        <div class="placeholder-text">
                            項目を選択し、「議事録を作成する」をクリックすると<br>ここに結果が表示されます。
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>💬 4. 会議AIアシスタントに質問</span>
                </div>
                <p style="font-size: 0.9rem; color: #64748b; margin-top: 0;">会議の背景や詳細について、チャット感覚で検索・質問できます。</p>
                <div class="qa-box">
                    <div class="qa-input-group">
                        <input type="text" id="qa-input" placeholder="例：鈴木さんは何部門？ / ゲストアカウントの扱いはどうなった？" onkeypress="handleEnter(event)">
                        <button class="btn-search" id="search-btn" onclick="askQuestion()">検索</button>
                    </div>
                    <div class="qa-answer" id="qa-answer">
                        <!-- ここにAIの回答が入ります -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const mockExtractedData = {
            "日付": "2026年11月18日（水） 定例ミーティング",
            "参加者": "高橋（PM/進行）、佐藤（情シス部門）、鈴木（営業部門）、田中（人事総務部門）",
            "要点": "・社内チャットツール刷新プロジェクトにおける、各部署のトライアル結果の共有と本番導入ツールの最終決定。\n・「BizChat」と「ChatWorks」の比較検討の結果、営業・情シスの要件を高く満たす「BizChat」の採用方針に合意。\n・導入スケジュール（来年1月末）、全社員向けのアナウンス手順、および過去ログ移行における制限事項の共有。",
            "決定事項": "・次期社内チャットツールとして「BizChat」を正式採用する。\n・本番導入のターゲット時期を「2027年1月末」に設定する。\n・過去のチャットログ移行は仕様上「過去1年分」のみとし、それ以前のデータは別環境にアーカイブ保存とする（全社周知必須）。",
            "タスク": "・【鈴木（営業）】11/24(火)まで：BizChatモバイルアプリ版の最終動作テストを実施・完了させる。\n・【佐藤（情シス）】12/5(土)まで：IT初心者や年配社員向けのBizChat簡易マニュアル（ドラフト版）を作成する。\n・【田中（人事）】12/10(木)まで：全社員向けの新ツール導入告知およびログ移行制限に関するアナウンス文面を作成・発信する。\n・【佐藤（情シス）】11/25(水)まで：BizChatのゲストアカウント招待枠の仕様および追加ライセンス費用についてメーカーへ確認する。",
            "重要事項": "・ログ移行の制限（過去1年分のみ）は、過去の履歴を参照する社員が多く混乱を招く恐れがあるため、全社アナナウンスの際に必ず強調して記載し、アーカイブへのアクセス方法も併せて案内すること。\n・全社員へのプレミアムアカウント付与は予算超過のリスクがあるため、ライセンスの割り当て基準（プレミアム/スタンダード）の策定が急務。",
            "意見": "・【営業/鈴木】：外出先からの顧客対応スピード向上の観点から、スマホアプリの動作が軽快なBizChatを強く推奨。\n・【人事/田中】：BizChatは多機能ゆえに、年配層やITリテラシーが高くない層の利用に懸念あり。充実したマニュアルサポートが不可欠。\n・【情シス/佐藤】：セキュリティ要件を満たす点でBizChatを支持。操作性の課題は情シス作成の簡易マニュアルで補完可能と判断。",
            "課題・懸念点": "・【コスト課題】全社員分のプレミアムアカウント一括付与による予算オーバーの懸念（部署ごとの権限・ライセンス振り分けの検討が必要）。\n・【リテラシー課題】高機能ツール導入による社内ヘルプデスクへの問い合わせ増加リスク（簡易マニュアルでの事前対策）。",
            "保留事項": "・社外パートナー向けの「ゲストアカウント」の運用方法（無料招待枠の有無、費用負担の仕組み）については、メーカー確認待ちのため次回持ち越し。",
            "次回予定": "・日時：2026年11月25日（水）13:00〜\n・主要アジェンダ：保留となった「ゲストアカウントの仕様と費用感」に関する報告と運用ルールの決定、およびライセンス割り当て方針の協議。"
        };

        function generateMinutes() {
            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const outputText = document.getElementById('output-text');
            const overlay = document.getElementById('processing-overlay');

            const checkboxes = document.querySelectorAll('#options-container input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert("少なくとも1つの項目を選択してください。");
                return;
            }

            btn.disabled = true;
            btnText.innerText = '⏳ AIが作成中です...';
            overlay.style.display = 'flex'; 
            document.getElementById('copy-btn').innerText = '📋 コピーする';

            setTimeout(() => {
                let plainTextOutput = '';
                checkboxes.forEach(cb => {
                    const key = cb.value;
                    const content = mockExtractedData[key] || "（該当データなし）";
                    plainTextOutput += `【${key}】\n${content}\n\n`;
                });
                outputText.innerText = plainTextOutput.trim();
                
                btn.disabled = false;
                btnText.innerText = '🚀 議事録を作成する';
                overlay.style.display = 'none'; 
            }, 2000); 
        }

        function askQuestion() {
            const inputField = document.getElementById('qa-input');
            const question = inputField.value.trim();
            const searchBtn = document.getElementById('search-btn');
            const answerBox = document.getElementById('qa-answer');

            if (!question) return;

            searchBtn.disabled = true;
            searchBtn.innerText = '検索中...';
            answerBox.style.display = 'none';

            setTimeout(() => {
                let answer = "";

                if (question.includes("鈴木")) {
                    answer = "【営業部門】です。\n詳細：営業部として、スマホアプリの動作が軽快で顧客対応スピードが上がる「BizChat」を強く推しています。また、11月24日までにBizChatモバイルアプリ版の最終動作テストを完了させるタスクを担当しています。";
                } else if (question.includes("ログ") || question.includes("過去") || question.includes("データ") || question.includes("移行")) {
                    answer = "新ツール（BizChat）への過去ログ移行は仕様上「過去1年分のみ」となります。\n詳細：それ以前のデータは別環境にアーカイブ保存されます。社員の混乱を避けるため、12月10日までに人事の田中さんが全社へアナウンスする際に、この制限事項とアーカイブのアクセス方法を強調して周知することが決定事項となっています。";
                } else if (question.includes("ゲスト") || question.includes("社外") || question.includes("アカウント")) {
                    answer = "ゲストアカウントの扱いは現在【保留】となっています。\n詳細：営業の鈴木さんから「引き続き無料で招待できる仕組みにしてほしい」との要望が出ましたが、仕様と追加費用について情シスの佐藤さんがメーカーに確認することになり、次回11月25日の会議に持ち越しとなりました。";
                } else if (question.includes("コスト") || question.includes("費用") || question.includes("ライセンス")) {
                    answer = "ライセンス費用について予算オーバーの懸念が挙がっています。\n詳細：全社員にプレミアムアカウントを付与すると予算を超過するため、一部の部署をスタンダードアカウントにするなど、部署ごとの権限・ライセンス振り分け（割り当て基準）を検討することが課題となっています。";
                } else {
                    answer = "入力された会議内容から、その質問に対する明確な言及を見つけることができませんでした。別の言い回しで検索するか、会議テキストに当該内容が含まれているかご確認ください。";
                }

                answerBox.innerText = answer;
                answerBox.style.display = 'block';
                searchBtn.disabled = false;
                searchBtn.innerText = '検索';
            }, 1500);
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        function copyToClipboard() {
            const outputText = document.getElementById('output-text').innerText;
            const copyBtn = document.getElementById('copy-btn');
            
            if (!outputText || outputText.includes("項目を選択し")) {
                alert("コピーする議事録がありません。");
                return;
            }

            navigator.clipboard.writeText(outputText).then(() => {
                copyBtn.innerText = '✅ コピーしました！';
                copyBtn.style.backgroundColor = '#dcfce3';
                copyBtn.style.color = '#166534';
                setTimeout(() => {
                    copyBtn.innerText = '📋 コピーする';
                    copyBtn.style.backgroundColor = '#e2e8f0';
                    copyBtn.style.color = '#475569';
                }, 3000);
            });
        }
    </script>
</body>
</html>
